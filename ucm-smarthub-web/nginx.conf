server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cabeçalhos de segurança básicos — equivalente ao helmet() da API, mas
    # para os ficheiros estáticos servidos directamente pelo nginx.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Ficheiros com hash no nome (assets/*) podem ser cacheados agressivamente
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA — qualquer rota desconhecida cai no index.html (React Router trata do resto).
    # index.html NUNCA deve ser cacheado: referencia os nomes (com hash) dos
    # assets do build actual — servir uma versão antiga em cache aponta para
    # ficheiros que já não existem depois do próximo deploy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
