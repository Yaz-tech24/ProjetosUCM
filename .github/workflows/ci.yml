name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ucm-smarthub-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ucm-smarthub-api/package-lock.json

      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend (Web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ucm-smarthub-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ucm-smarthub-web/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run lint
